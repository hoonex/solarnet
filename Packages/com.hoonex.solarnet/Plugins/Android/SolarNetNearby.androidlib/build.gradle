apply plugin: 'com.android.library'

def unityProperty = { String name, String fallback ->
    def value = project.findProperty(name)
    return value == null ? fallback : value.toString()
}

android {
    namespace 'com.hoonex.solarnet.nearby'
    compileSdk unityProperty('unity.compileSdkVersion', '36') as int

    defaultConfig {
        minSdk Math.max(unityProperty('unity.minSdkVersion', '24') as int, 24)
        targetSdk unityProperty('unity.targetSdkVersion', '36') as int
    }

    compileOptions {
        sourceCompatibility JavaVersion.valueOf(unityProperty('unity.javaCompatabilityVersion', 'VERSION_17'))
        targetCompatibility JavaVersion.valueOf(unityProperty('unity.javaCompatabilityVersion', 'VERSION_17'))
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-nearby:19.4.0'
}
