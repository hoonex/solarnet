apply plugin: 'com.android.application'

android {
    namespace 'com.hoonex.solarnet.probe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hoonex.solarnet.probe'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':solarnet-bluetooth-classic')
}
