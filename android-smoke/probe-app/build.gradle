apply plugin: 'com.android.application'

def sourceSha = System.getenv('SOLARNET_SOURCE_SHA') ?: System.getenv('GITHUB_SHA') ?: 'unknown'

android {
    namespace 'com.hoonex.solarnet.probe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hoonex.solarnet.probe'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
        buildConfigField 'String', 'SOURCE_SHA', "\"${sourceSha}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    implementation project(':solarnet-nearby')
    implementation project(':solarnet-bluetooth-classic')
}
