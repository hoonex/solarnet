apply plugin: 'com.android.application'

android {
    namespace 'com.hoonex.solarnet.gridduel'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hoonex.solarnet.gridduel'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '0.6.0'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    implementation project(':solarnet-nearby')
    implementation project(':solarnet-bluetooth-classic')
}
