name: M20 Authority Epoch Core

on:
  push:
    branches:
      - feat/authority-epoch-persistence

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact mission base
        run: test "$(git rev-parse HEAD^)" = "5dc4e1e43e94d4124da9cffc6b9d644d99d80348"
      - name: Remove in-memory ledger requirement from persisted durability proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Packages/com.hoonex.solarnet/Runtime/Session/SolarAuthorityEpoch.cs')
          text = p.read_text()
          old = '''                if (!authoritativeSession.IsReplicatedThrough(\n                    authoritativeSession.RequiredReplicationPeerId,\n                    authoritativeSession.KnownNextTurnIndex))\n                    throw new InvalidOperationException("Required replica has not proven the authority state being persisted.");\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one persisted-ledger gate')
          p.write_text(text.replace(old, '', 1))
          PY
      - name: Verify authority epoch core
        run: |
          dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.AuthorityEpochResume.SmokeTests/SolarNet.AuthorityEpochResume.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.DurabilityBarrier.SmokeTests/SolarNet.DurabilityBarrier.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.ProcessResume.SmokeTests/SolarNet.ProcessResume.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
      - name: Publish bounded core fix
        run: |
          rm .github/workflows/m20-epoch-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/com.hoonex.solarnet/Runtime/Session/SolarAuthorityEpoch.cs .github/workflows/m20-epoch-core.yml
          git commit -m "Validate durable authority epoch persistence"
          git push origin HEAD:feat/authority-epoch-persistence
