name: M23 Off-main APK Hash

on:
  push:
    branches:
      - feat/probe-evidence-bundle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Guard exact input
        run: |
          test "$(git rev-parse HEAD^)" = "d28c8e773e1984bda0cab56bed4ebba215fb39c0"
          test -f .github/m23-offmain-apk-hash.py
      - name: Apply bounded main-thread fix
        run: python3 .github/m23-offmain-apk-hash.py
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Probe 0.4.0
        env:
          SOLARNET_SOURCE_SHA: ${{ github.sha }}
        run: gradle -p android-smoke :probe-app:assembleDebug --no-daemon --stacktrace
      - name: Publish product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/MainActivity.java
          test "$(git diff --cached --name-only)" = "android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/MainActivity.java"
          git commit -m "Move probe APK hashing off main thread"
          git push origin HEAD:feat/probe-evidence-bundle
