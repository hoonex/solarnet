name: Relay Siege Cycle Lab

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  cycle-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run exact-hand Cycle Lab smoke
        run: |
          rm -rf /tmp/relay-cycle-lab && mkdir -p /tmp/relay-cycle-lab
          javac -d /tmp/relay-cycle-lab \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeCards.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeGame.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeAi.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeDeckLab.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeCycleLab.java \
            android-smoke/game-tests/RelaySiegeCycleLabSmoke.java
          java -cp /tmp/relay-cycle-lab com.hoonex.solarnet.gridduel.RelaySiegeCycleLabSmoke
