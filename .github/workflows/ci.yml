name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build SolarNet core
        run: dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
      - name: Compile Unity Android C# bridge surface
        run: dotnet build tests/SolarNet.UnityAndroidCompile/SolarNet.UnityAndroidCompile.csproj --configuration Release --nologo
      - name: Compile Grid Duel Unity sample surface
        run: dotnet build tests/SolarNet.GridDuel.UnityCompile/SolarNet.GridDuel.UnityCompile.csproj --configuration Release --nologo
      - name: Run multiplayer smoke tests
        run: dotnet run --project tests/SolarNet.Core.SmokeTests/SolarNet.Core.SmokeTests.csproj --configuration Release --nologo
      - name: Run state-integrity smoke tests
        run: dotnet run --project tests/SolarNet.StateIntegrity.SmokeTests/SolarNet.StateIntegrity.SmokeTests.csproj --configuration Release --nologo
      - name: Run replication acknowledgement tests
        run: dotnet run --project tests/SolarNet.ReplicationAck.SmokeTests/SolarNet.ReplicationAck.SmokeTests.csproj --configuration Release --nologo
      - name: Run designated-replica durability barrier tests
        run: dotnet run --project tests/SolarNet.DurabilityBarrier.SmokeTests/SolarNet.DurabilityBarrier.SmokeTests.csproj --configuration Release --nologo
      - name: Run deterministic chaos soak
        run: dotnet run --project tests/SolarNet.ChaosSoak.SmokeTests/SolarNet.ChaosSoak.SmokeTests.csproj --configuration Release --nologo
      - name: Run client process-resume tests
        run: dotnet run --project tests/SolarNet.ProcessResume.SmokeTests/SolarNet.ProcessResume.SmokeTests.csproj --configuration Release --nologo
      - name: Run authority-checkpoint promotion tests
        run: dotnet run --project tests/SolarNet.AuthorityCheckpoint.SmokeTests/SolarNet.AuthorityCheckpoint.SmokeTests.csproj --configuration Release --nologo
      - name: Run host-migration planner tests
        run: dotnet run --project tests/SolarNet.HostMigrationPlanner.SmokeTests/SolarNet.HostMigrationPlanner.SmokeTests.csproj --configuration Release --nologo
      - name: Run migration orchestration tests
        run: dotnet run --project tests/SolarNet.MigrationOrchestration.SmokeTests/SolarNet.MigrationOrchestration.SmokeTests.csproj --configuration Release --nologo
      - name: Run Grid Duel host-migration tests
        run: dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
      - name: Run room-lifecycle smoke tests
        run: dotnet run --project tests/SolarNet.Room.SmokeTests/SolarNet.Room.SmokeTests.csproj --configuration Release --nologo
      - name: Run Bluetooth Classic smoke tests
        run: dotnet run --project tests/SolarNet.BluetoothClassic.SmokeTests/SolarNet.BluetoothClassic.SmokeTests.csproj --configuration Release --nologo
      - name: Run Grid Duel integration tests
        run: dotnet run --project tests/SolarNet.GridDuel.SmokeTests/SolarNet.GridDuel.SmokeTests.csproj --configuration Release --nologo

  android-transports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Compile Nearby Android library
        run: gradle -p android-smoke :solarnet-nearby:assembleDebug --no-daemon --stacktrace
      - name: Compile Bluetooth Classic Android library
        run: gradle -p android-smoke :solarnet-bluetooth-classic:assembleDebug --no-daemon --stacktrace
      - name: Build physical transport probe APK
        run: gradle -p android-smoke :probe-app:assembleDebug --no-daemon --stacktrace
      - name: Write probe checksum
        run: |
          cd android-smoke/probe-app/build/outputs/apk/debug
          sha256sum probe-app-debug.apk > probe-app-debug.apk.sha256
      - name: Upload transport probe APK
        uses: actions/upload-artifact@v4
        with:
          name: solarnet-transport-probe-apk
          path: |
            android-smoke/probe-app/build/outputs/apk/debug/probe-app-debug.apk
            android-smoke/probe-app/build/outputs/apk/debug/probe-app-debug.apk.sha256
          retention-days: 14
