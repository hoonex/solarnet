name: Nightshift CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile shared rules, protocol, server and smoke tests
        run: |
          rm -rf /tmp/nightshift-classes && mkdir -p /tmp/nightshift-classes
          javac --release 17 -d /tmp/nightshift-classes \
            $(find shared/src/main/java server/src/main/java tests -name '*.java' -print)
      - name: Run game simulation smoke
        run: java -cp /tmp/nightshift-classes com.hoonex.nightshift.tests.GameSimulationSmoke
      - name: Run binary protocol smoke
        run: java -cp /tmp/nightshift-classes com.hoonex.nightshift.tests.ProtocolSmoke
      - name: Run real two-client authority smoke
        run: java -cp /tmp/nightshift-classes com.hoonex.nightshift.tests.NightshiftServerSmoke
      - name: Package authority server jar
        run: |
          printf 'Main-Class: com.hoonex.nightshift.server.NightshiftServer\n' > /tmp/nightshift-manifest.mf
          jar cfm nightshift-server.jar /tmp/nightshift-manifest.mf -C /tmp/nightshift-classes .
          sha256sum nightshift-server.jar > nightshift-server.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nightshift-authority-server
          path: |
            nightshift-server.jar
            nightshift-server.jar.sha256
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Nightshift Android APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Nightshift 0.1.0 identity and no Bluetooth permissions
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/nightshift-badging.txt
          grep -Fq "package: name='com.hoonex.nightshift' versionCode='1' versionName='0.1.0'" /tmp/nightshift-badging.txt
          grep -Fq "sdkVersion:'24'" /tmp/nightshift-badging.txt
          grep -Fq "application-label:'Nightshift'" /tmp/nightshift-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/nightshift-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/nightshift-permissions.txt
          if grep -Fq 'android.permission.BLUETOOTH' /tmp/nightshift-permissions.txt; then
            echo 'Bluetooth permission leaked into clean-slate app' >&2
            exit 1
          fi
      - name: Stage APK and checksum
        run: |
          OUT="android/app/build/outputs/apk/debug"
          cp "$OUT/app-debug.apk" "$OUT/nightshift-0.1.0-debug.apk"
          cd "$OUT"
          sha256sum nightshift-0.1.0-debug.apk > nightshift-0.1.0-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nightshift-android-apk
          path: |
            android/app/build/outputs/apk/debug/nightshift-0.1.0-debug.apk
            android/app/build/outputs/apk/debug/nightshift-0.1.0-debug.apk.sha256
          retention-days: 14
