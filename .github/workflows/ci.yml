name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build SolarNet core
        run: dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
      - name: Compile Unity Android C# bridge surface
        run: dotnet build tests/SolarNet.UnityAndroidCompile/SolarNet.UnityAndroidCompile.csproj --configuration Release --nologo
      - name: Compile Grid Duel Unity sample surface
        run: dotnet build tests/SolarNet.GridDuel.UnityCompile/SolarNet.GridDuel.UnityCompile.csproj --configuration Release --nologo
      - name: Run multiplayer smoke tests
        run: dotnet run --project tests/SolarNet.Core.SmokeTests/SolarNet.Core.SmokeTests.csproj --configuration Release --nologo
      - name: Run state-integrity smoke tests
        run: dotnet run --project tests/SolarNet.StateIntegrity.SmokeTests/SolarNet.StateIntegrity.SmokeTests.csproj --configuration Release --nologo
      - name: Run replication acknowledgement tests
        run: dotnet run --project tests/SolarNet.ReplicationAck.SmokeTests/SolarNet.ReplicationAck.SmokeTests.csproj --configuration Release --nologo
      - name: Run designated-replica durability barrier tests
        run: dotnet run --project tests/SolarNet.DurabilityBarrier.SmokeTests/SolarNet.DurabilityBarrier.SmokeTests.csproj --configuration Release --nologo
      - name: Run deterministic chaos soak
        run: dotnet run --project tests/SolarNet.ChaosSoak.SmokeTests/SolarNet.ChaosSoak.SmokeTests.csproj --configuration Release --nologo
      - name: Run client process-resume tests
        run: dotnet run --project tests/SolarNet.ProcessResume.SmokeTests/SolarNet.ProcessResume.SmokeTests.csproj --configuration Release --nologo
      - name: Run authority epoch process-resume tests
        run: dotnet run --project tests/SolarNet.AuthorityEpochResume.SmokeTests/SolarNet.AuthorityEpochResume.SmokeTests.csproj --configuration Release --nologo
      - name: Run authority-checkpoint promotion tests
        run: dotnet run --project tests/SolarNet.AuthorityCheckpoint.SmokeTests/SolarNet.AuthorityCheckpoint.SmokeTests.csproj --configuration Release --nologo
      - name: Run host-migration planner tests
        run: dotnet run --project tests/SolarNet.HostMigrationPlanner.SmokeTests/SolarNet.HostMigrationPlanner.SmokeTests.csproj --configuration Release --nologo
      - name: Run migration orchestration tests
        run: dotnet run --project tests/SolarNet.MigrationOrchestration.SmokeTests/SolarNet.MigrationOrchestration.SmokeTests.csproj --configuration Release --nologo
      - name: Run Grid Duel host-migration tests
        run: dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
      - name: Run room-lifecycle smoke tests
        run: dotnet run --project tests/SolarNet.Room.SmokeTests/SolarNet.Room.SmokeTests.csproj --configuration Release --nologo
      - name: Run Bluetooth Classic smoke tests
        run: dotnet run --project tests/SolarNet.BluetoothClassic.SmokeTests/SolarNet.BluetoothClassic.SmokeTests.csproj --configuration Release --nologo
      - name: Run Grid Duel integration tests
        run: dotnet run --project tests/SolarNet.GridDuel.SmokeTests/SolarNet.GridDuel.SmokeTests.csproj --configuration Release --nologo

  android-transports:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOLARNET_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Run probe soak statistics smoke test
        run: |
          rm -rf /tmp/solarnet-probe-stats && mkdir -p /tmp/solarnet-probe-stats
          javac -d /tmp/solarnet-probe-stats \
            android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/ProbeSoakStats.java \
            android-smoke/probe-tests/ProbeSoakStatsSmoke.java
          java -cp /tmp/solarnet-probe-stats com.hoonex.solarnet.probe.ProbeSoakStatsSmoke
      - name: Run probe evidence envelope smoke test
        run: |
          rm -rf /tmp/solarnet-probe-evidence && mkdir -p /tmp/solarnet-probe-evidence
          javac -d /tmp/solarnet-probe-evidence \
            android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/ProbeEvidenceSnapshot.java \
            android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/ProbeEvidenceEnvelope.java \
            android-smoke/probe-tests/ProbeEvidenceSnapshotSmoke.java
          java -cp /tmp/solarnet-probe-evidence com.hoonex.solarnet.probe.ProbeEvidenceSnapshotSmoke
      - name: Run Grid Duel Android game logic smoke test
        run: |
          rm -rf /tmp/grid-duel-game && mkdir -p /tmp/grid-duel-game
          javac -d /tmp/grid-duel-game \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/GridDuelGame.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/GameProtocol.java \
            android-smoke/game-tests/GridDuelGameSmoke.java
          java -cp /tmp/grid-duel-game com.hoonex.solarnet.gridduel.GridDuelGameSmoke
      - name: Compile Nearby Android library
        run: gradle -p android-smoke :solarnet-nearby:assembleDebug --no-daemon --stacktrace
      - name: Compile Bluetooth Classic Android library
        run: gradle -p android-smoke :solarnet-bluetooth-classic:assembleDebug --no-daemon --stacktrace
      - name: Build physical transport probe APK
        run: gradle -p android-smoke :probe-app:assembleDebug --no-daemon --stacktrace
      - name: Verify Probe 0.4.0 build identity and radio manifest
        run: |
          APK="android-smoke/probe-app/build/outputs/apk/debug/probe-app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/probe-badging.txt
          grep -Fq "versionCode='4'" /tmp/probe-badging.txt
          grep -Fq "versionName='0.4.0'" /tmp/probe-badging.txt
          grep -Fq "sdkVersion:'24'" /tmp/probe-badging.txt
          BUILD_CONFIG=$(find android-smoke/probe-app/build/generated/source/buildConfig/debug -name BuildConfig.java -print -quit)
          test -n "$BUILD_CONFIG"
          grep -Fq "SOURCE_SHA = \"${SOLARNET_SOURCE_SHA}\"" "$BUILD_CONFIG"
          "$AAPT" dump permissions "$APK" | tee /tmp/probe-permissions.txt
          grep -Fq 'android.permission.BLUETOOTH_ADVERTISE' /tmp/probe-permissions.txt
          grep -Fq 'android.permission.BLUETOOTH_CONNECT' /tmp/probe-permissions.txt
          grep -Fq 'android.permission.BLUETOOTH_SCAN' /tmp/probe-permissions.txt
          grep -Fq 'android.permission.NEARBY_WIFI_DEVICES' /tmp/probe-permissions.txt
      - name: Write probe checksum
        run: |
          cd android-smoke/probe-app/build/outputs/apk/debug
          sha256sum probe-app-debug.apk > probe-app-debug.apk.sha256
      - name: Upload transport probe APK
        uses: actions/upload-artifact@v4
        with:
          name: solarnet-transport-probe-apk
          path: |
            android-smoke/probe-app/build/outputs/apk/debug/probe-app-debug.apk
            android-smoke/probe-app/build/outputs/apk/debug/probe-app-debug.apk.sha256
          retention-days: 14
      - name: Build playable Grid Duel Android APK
        run: gradle -p android-smoke :grid-duel-game:assembleDebug --no-daemon --stacktrace
      - name: Verify Grid Duel Android APK identity
        run: |
          APK="android-smoke/grid-duel-game/build/outputs/apk/debug/grid-duel-game-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/grid-duel-badging.txt
          grep -Fq "package: name='com.hoonex.solarnet.gridduel' versionCode='1' versionName='0.1.0'" /tmp/grid-duel-badging.txt
          grep -Fq "sdkVersion:'24'" /tmp/grid-duel-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/grid-duel-permissions.txt
          grep -Fq 'android.permission.BLUETOOTH_CONNECT' /tmp/grid-duel-permissions.txt
          grep -Fq 'android.permission.BLUETOOTH_SCAN' /tmp/grid-duel-permissions.txt
          grep -Fq 'android.permission.NEARBY_WIFI_DEVICES' /tmp/grid-duel-permissions.txt
      - name: Write Grid Duel checksum
        run: |
          cd android-smoke/grid-duel-game/build/outputs/apk/debug
          sha256sum grid-duel-game-debug.apk > grid-duel-game-debug.apk.sha256
      - name: Upload playable Grid Duel APK
        uses: actions/upload-artifact@v4
        with:
          name: grid-duel-android-game-apk
          path: |
            android-smoke/grid-duel-game/build/outputs/apk/debug/grid-duel-game-debug.apk
            android-smoke/grid-duel-game/build/outputs/apk/debug/grid-duel-game-debug.apk.sha256
          retention-days: 14
