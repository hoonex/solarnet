name: M21 Physical Radio Soak Harness

on:
  push:
    branches:
      - feat/physical-radio-soak-harness

permissions:
  contents: write

jobs:
  wire-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/physical-radio-soak-harness
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify exact mission parent
        run: test "$(git rev-parse HEAD^)" = "d178357b9c207bba5b9ac9658017030224cecd0a"
      - name: Wire probe soak UI and permanent CI
        shell: python
        run: |
          from pathlib import Path

          main = Path('android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/MainActivity.java')
          text = main.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import android.provider.Settings;\nimport android.view.View;',
              'import android.provider.Settings;\nimport android.util.Log;\nimport android.view.View;',
              'Log import')

          replace_once(
              '    private TextView logView;\n    private LinearLayout deviceList;\n    private boolean hostMode;',
              '    private TextView logView;\n    private TextView soakView;\n    private LinearLayout deviceList;\n    private ProbeSoakController soakController;\n    private boolean hostMode;',
              'soak fields')

          replace_once(
              '        bridge = new SolarBluetoothClassicBridge(this, new ProbeCallback());\n        log("Probe ready. Pair the two phones in Android settings before the RFCOMM test.");',
              '''        bridge = new SolarBluetoothClassicBridge(this, new ProbeCallback());\n        soakController = new ProbeSoakController(bridge, this::nextId, new ProbeSoakController.Listener() {\n            @Override\n            public void onProgress(ProbeSoakStats.Snapshot snapshot) {\n                runOnUiThread(() -> {\n                    if (soakView != null) soakView.setText("Soak: " + snapshot.toSummary());\n                });\n            }\n\n            @Override\n            public void onFinished(ProbeSoakStats.Snapshot snapshot, String reason) {\n                String result = buildSoakResultJson(snapshot, reason);\n                Log.i("SolarNetProbe", "SOLARNET_PROBE_RESULT " + result);\n                log("SOAK FINISH " + snapshot.toSummary() + " reason=" + reason);\n            }\n\n            @Override\n            public void onLog(String message) {\n                log(message);\n            }\n        });\n        log("Probe ready. Pair the two phones in Android settings before the RFCOMM test.");''',
              'soak controller init')

          replace_once(
              '        root.addView(button("Broadcast PING", v -> broadcastPing()));\n        root.addView(button("Stop all connections", v -> stopAll()));',
              '''        root.addView(button("Broadcast PING", v -> broadcastPing()));\n        root.addView(button("CLIENT: start 10-minute soak", v -> startSoak()));\n        root.addView(button("Stop soak", v -> stopSoak()));\n\n        soakView = new TextView(this);\n        soakView.setText("Soak: idle");\n        soakView.setTextSize(14f);\n        soakView.setTextIsSelectable(true);\n        soakView.setPadding(0, dp(8), 0, 0);\n        root.addView(soakView);\n\n        root.addView(button("Stop all connections", v -> stopAll()));''',
              'soak UI')

          replace_once(
              '    private void stopAll() {\n        bridge.stopAll(nextId());',
              '''    private void startSoak() {\n        if (hostMode) {\n            log("Start the timed soak on the CLIENT phone; the HOST only echoes probe PING packets.");\n            return;\n        }\n        synchronized (connections) {\n            if (connections.isEmpty()) {\n                log("Connect to the host before starting the soak.");\n                return;\n            }\n        }\n        try {\n            String runId = soakController.start();\n            setStatus("soak running " + runId);\n        } catch (Throwable t) {\n            log("ERROR start soak: " + message(t));\n        }\n    }\n\n    private void stopSoak() {\n        if (soakController == null || !soakController.isRunning()) {\n            log("No soak run is active.");\n            return;\n        }\n        soakController.stop("manual-stop");\n        setStatus("soak stopped");\n    }\n\n    private void stopAll() {\n        if (soakController != null && soakController.isRunning()) soakController.stop("stop-all");\n        bridge.stopAll(nextId());''',
              'soak controls')

          replace_once(
              '    private static String message(Throwable t) {\n        String text = t.getMessage();\n        return text == null || text.length() == 0 ? t.getClass().getSimpleName() : text;\n    }',
              '''    private String buildSoakResultJson(ProbeSoakStats.Snapshot snapshot, String reason) {\n        String device = Build.MANUFACTURER + " " + Build.MODEL;\n        return "{" +\n                "\\\"transport\\\":\\\"bluetooth-classic\\\"," +\n                "\\\"probeVersion\\\":\\\"0.2.0\\\"," +\n                "\\\"deviceModel\\\":\\\"" + jsonEscape(device) + "\\\"," +\n                "\\\"sdkInt\\\":" + Build.VERSION.SDK_INT + "," +\n                "\\\"result\\\":" + snapshot.toJson(reason) +\n                "}";\n    }\n\n    private static String jsonEscape(String value) {\n        return value.replace("\\\\", "\\\\\\\\").replace("\\\"", "\\\\\\\"");\n    }\n\n    private static String message(Throwable t) {\n        String text = t.getMessage();\n        return text == null || text.length() == 0 ? t.getClass().getSimpleName() : text;\n    }''',
              'result envelope')

          replace_once(
              '    protected void onDestroy() {\n        if (bridge != null) {',
              '    protected void onDestroy() {\n        if (soakController != null) {\n            try { soakController.close(); } catch (Throwable ignored) { }\n        }\n        if (bridge != null) {',
              'controller teardown')

          replace_once(
              '        public void onOperationResult(long requestId, boolean success, String error) {\n            log("op#" + requestId + " " + (success ? "OK" : "FAILED: " + error));',
              '        public void onOperationResult(long requestId, boolean success, String error) {\n            if (soakController != null) soakController.onOperationResult(requestId, success, error);\n            log("op#" + requestId + " " + (success ? "OK" : "FAILED: " + error));',
              'operation callback')

          replace_once(
              '        public void onDisconnected(String connectionId) {\n            synchronized (connections) { connections.remove(connectionId); }',
              '        public void onDisconnected(String connectionId) {\n            if (soakController != null) soakController.onDisconnected();\n            synchronized (connections) { connections.remove(connectionId); }',
              'disconnect callback')

          replace_once(
              '        public void onBytesReceived(String connectionId, byte[] payload) {\n            String text = new String(payload, StandardCharsets.UTF_8);',
              '        public void onBytesReceived(String connectionId, byte[] payload) {\n            if (soakController != null && soakController.handleBytes(connectionId, payload, hostMode)) return;\n            String text = new String(payload, StandardCharsets.UTF_8);',
              'packet routing')

          replace_once(
              '        public void onError(String operation, String message) {\n            setStatus("error: " + operation);',
              '        public void onError(String operation, String message) {\n            if (soakController != null) soakController.onBridgeError(operation, message);\n            setStatus("error: " + operation);',
              'error callback')

          main.write_text(text)

          gradle = Path('android-smoke/probe-app/build.gradle')
          text = gradle.read_text()
          if text.count("versionCode 1") != 1 or text.count("versionName '0.1.0'") != 1:
              raise SystemExit('probe version match failed')
          text = text.replace('versionCode 1', 'versionCode 2', 1).replace("versionName '0.1.0'", "versionName '0.2.0'", 1)
          gradle.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = '''      - name: Ensure Android 36 SDK\n        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null\n      - name: Compile Nearby Android library'''
          new = '''      - name: Ensure Android 36 SDK\n        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null\n      - name: Run probe soak statistics smoke test\n        run: |\n          rm -rf /tmp/solarnet-probe-stats && mkdir -p /tmp/solarnet-probe-stats\n          javac -d /tmp/solarnet-probe-stats \\\n            android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/ProbeSoakStats.java \\\n            android-smoke/probe-tests/ProbeSoakStatsSmoke.java\n          java -cp /tmp/solarnet-probe-stats com.hoonex.solarnet.probe.ProbeSoakStatsSmoke\n      - name: Compile Nearby Android library'''
          if text.count(old) != 1:
              raise SystemExit(f'permanent CI insertion expected 1 match, got {text.count(old)}')
          ci.write_text(text.replace(old, new, 1))
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Prove soak statistics and Probe APK
        run: |
          rm -rf /tmp/solarnet-probe-stats && mkdir -p /tmp/solarnet-probe-stats
          javac -d /tmp/solarnet-probe-stats \
            android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/ProbeSoakStats.java \
            android-smoke/probe-tests/ProbeSoakStatsSmoke.java
          java -cp /tmp/solarnet-probe-stats com.hoonex.solarnet.probe.ProbeSoakStatsSmoke
          gradle -p android-smoke :probe-app:assembleDebug --no-daemon --stacktrace
      - name: Publish bounded M21 wiring
        run: |
          git rm .github/workflows/m21-soak-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-smoke/probe-app/src/main/java/com/hoonex/solarnet/probe/MainActivity.java android-smoke/probe-app/build.gradle .github/workflows/ci.yml
          git commit -m "Wire physical Bluetooth soak probe"
          git push origin HEAD:feat/physical-radio-soak-harness
