name: M16 Room Migration Patch

on:
  push:
    branches:
      - feat/migrated-room-transport-switch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify bounded mission input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "403cb44f55f427775be6009709ab8089bc8817ba"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m16-room-migration-patch.yml"
      - name: Patch room authority invariant
        shell: python
        run: |
          from pathlib import Path

          path = Path("Packages/com.hoonex.solarnet/Runtime/Room/SolarRoomSession.cs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("public sealed class SolarRoomSession", "public sealed partial class SolarRoomSession"),
              ("var includesHostAtZero = false;", "var includesHost = false;"),
              ("if (player.Slot == 0 && string.Equals(player.PeerId, HostPeerId, StringComparison.Ordinal)) includesHostAtZero = true;", "if (string.Equals(player.PeerId, HostPeerId, StringComparison.Ordinal)) includesHost = true;"),
              ("if (!includesHostAtZero) throw new InvalidDataException(\"Room snapshot does not preserve host slot zero.\");", "if (!includesHost) throw new InvalidDataException(\"Room snapshot does not include its declared host.\");"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Remove mission workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m16-room-migration-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          expected=$'.github/workflows/m16-room-migration-patch.yml\nPackages/com.hoonex.solarnet/Runtime/Room/SolarRoomSession.cs'
          test "$(git diff --cached --name-only)" = "$expected"
          git commit -m "Allow migrated room hosts outside slot zero"
          git push origin HEAD:feat/migrated-room-transport-switch
