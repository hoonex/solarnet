name: M24 Grid Duel READY Handshake

on:
  push:
    branches:
      - feat/grid-duel-android-game

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply bounded READY handshake patch
        run: python3 .github/m24-ready-handshake.py
      - name: Run Grid Duel pure Java smoke
        run: |
          rm -rf /tmp/grid-duel-game && mkdir -p /tmp/grid-duel-game
          javac -d /tmp/grid-duel-game \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/GridDuelGame.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/GameProtocol.java \
            android-smoke/game-tests/GridDuelGameSmoke.java
          java -cp /tmp/grid-duel-game com.hoonex.solarnet.gridduel.GridDuelGameSmoke
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build playable Grid Duel APK
        run: gradle -p android-smoke :grid-duel-game:assembleDebug --no-daemon --stacktrace
      - name: Publish game patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/MainActivity.java
          test "$(git diff --cached --name-only)" = "android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/MainActivity.java"
          git commit -m "Add network-ready state handshake"
          git push origin HEAD:feat/grid-duel-android-game
