name: M28 Tactical Trainer Scenario Fix

on:
  push:
    branches:
      - feat/relay-siege-tactical-trainer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relay-siege-tactical-trainer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply bounded scenario correction
        run: python3 .github/m28-trainer-scenario-fix.py
      - name: Prove trainer outcomes
        run: |
          rm -rf /tmp/relay-trainer && mkdir -p /tmp/relay-trainer
          javac -d /tmp/relay-trainer \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeCards.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeGame.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeAi.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeTacticalTrainer.java \
            android-smoke/game-tests/RelaySiegeTacticalTrainerSmoke.java
          java -cp /tmp/relay-trainer com.hoonex.solarnet.gridduel.RelaySiegeTacticalTrainerSmoke
      - name: Publish only verified product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeTacticalTrainer.java
          test "$(git diff --cached --name-only)" = "android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeTacticalTrainer.java"
          git commit -m "Tune building-pull trainer scenario"
          git push origin HEAD:feat/relay-siege-tactical-trainer
