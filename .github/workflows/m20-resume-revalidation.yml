name: M20 Resume Replica Revalidation

on:
  push:
    branches:
      - feat/authority-epoch-persistence

permissions:
  contents: write

jobs:
  patch-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authority-epoch-persistence
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact mission parent
        run: test "$(git rev-parse HEAD^)" = "47a2f66e40d517116c1cd9439751b716a71eb460"
      - name: Patch resumed-authority revalidation fence
        shell: python
        run: |
          from pathlib import Path

          durability = Path('Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.Durability.cs')
          text = durability.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        private SolarTurnCommit _pendingDurabilityCommit;\n        private TaskCompletionSource<bool> _pendingDurabilityCompletion;',
              '        private SolarTurnCommit _pendingDurabilityCommit;\n        private TaskCompletionSource<bool> _pendingDurabilityCompletion;\n        private bool _durabilityRevalidationPending;\n        private long _durabilityRevalidationNextTurnIndex;\n        private string _durabilityRevalidationStateHash = string.Empty;',
              'revalidation fields')

          replace_once(
              '        public bool DurabilityPending\n        {\n            get\n            {\n                if (!IsHost || !DurabilityBarrierEnabled) return false;\n                lock (_durabilityGate) return _pendingDurabilityCommit != null;\n            }\n        }\n\n        public event Action<SolarDurabilityAdvance> DurabilityAdvanced;',
              '        public bool DurabilityPending\n        {\n            get\n            {\n                if (!IsHost || !DurabilityBarrierEnabled) return false;\n                lock (_durabilityGate) return _pendingDurabilityCommit != null;\n            }\n        }\n\n        public bool DurabilityRevalidationPending\n        {\n            get\n            {\n                if (!IsHost || !DurabilityBarrierEnabled) return false;\n                lock (_durabilityGate) return _durabilityRevalidationPending;\n            }\n        }\n\n        public event Action<SolarDurabilityAdvance> DurabilityAdvanced;',
              'revalidation property')

          replace_once(
              '        private bool HasPendingDurabilityCommit()\n        {\n            if (!DurabilityBarrierEnabled) return false;\n            lock (_durabilityGate) return _pendingDurabilityCommit != null;\n        }\n\n        private Task BeginDurabilityBarrier(SolarTurnCommit commit)',
              '        private bool HasPendingDurabilityCommit()\n        {\n            if (!DurabilityBarrierEnabled) return false;\n            lock (_durabilityGate) return _pendingDurabilityCommit != null || _durabilityRevalidationPending;\n        }\n\n        internal void RequireDurabilityRevalidation(long nextTurnIndex, string stateHash)\n        {\n            if (!IsHost) throw new InvalidOperationException("Only the authoritative host can require durability revalidation.");\n            if (!DurabilityBarrierEnabled) throw new InvalidOperationException("Durability revalidation requires a designated replica barrier.");\n            if (nextTurnIndex < 0) throw new ArgumentOutOfRangeException(nameof(nextTurnIndex));\n            if (string.IsNullOrWhiteSpace(stateHash)) throw new ArgumentException("State hash is required.", nameof(stateHash));\n\n            lock (_durabilityGate)\n            {\n                if (_pendingDurabilityCommit != null)\n                    throw new InvalidOperationException("Cannot begin resume revalidation while a durability commit is pending.");\n                if (nextTurnIndex != _durableNextTurnIndex)\n                    throw new InvalidOperationException("Resume revalidation frontier must match the persisted durable frontier.");\n                _durabilityRevalidationPending = true;\n                _durabilityRevalidationNextTurnIndex = nextTurnIndex;\n                _durabilityRevalidationStateHash = stateHash;\n            }\n        }\n\n        private Task BeginDurabilityBarrier(SolarTurnCommit commit)',
              'revalidation initializer')

          old = '''            SolarTurnCommit durableCommit = null;\n            TaskCompletionSource<bool> completion = null;\n            lock (_durabilityGate)\n            {\n                if (_pendingDurabilityCommit == null) return;\n                if (acknowledgement.NextTurnIndex < _pendingDurabilityCommit.NextTurnIndex) return;\n\n                durableCommit = _pendingDurabilityCommit;\n                completion = _pendingDurabilityCompletion;\n                _durableNextTurnIndex = durableCommit.NextTurnIndex;\n                _pendingDurabilityCommit = null;\n                _pendingDurabilityCompletion = null;\n            }\n\n            // Replication proof is recorded before the waiting submit task resumes.\n            // ActionCommitted remains the local authoritative-commit signal; DurabilityAdvanced is the replication-safe signal.\n            if (completion != null) completion.TrySetResult(true);\n\n            var handler = DurabilityAdvanced;\n            if (handler != null)\n                handler(new SolarDurabilityAdvance(_requiredReplicationPeerId, durableCommit.NextTurnIndex, durableCommit.StateHash));'''
          new = '''            SolarTurnCommit durableCommit = null;\n            TaskCompletionSource<bool> completion = null;\n            lock (_durabilityGate)\n            {\n                if (_durabilityRevalidationPending &&\n                    acknowledgement.NextTurnIndex >= _durabilityRevalidationNextTurnIndex &&\n                    string.Equals(acknowledgement.StateHash, _durabilityRevalidationStateHash, StringComparison.Ordinal))\n                {\n                    _durabilityRevalidationPending = false;\n                    _durabilityRevalidationNextTurnIndex = 0;\n                    _durabilityRevalidationStateHash = string.Empty;\n                }\n\n                if (_pendingDurabilityCommit == null) return;\n                if (acknowledgement.NextTurnIndex < _pendingDurabilityCommit.NextTurnIndex) return;\n\n                durableCommit = _pendingDurabilityCommit;\n                completion = _pendingDurabilityCompletion;\n                _durableNextTurnIndex = durableCommit.NextTurnIndex;\n                _pendingDurabilityCommit = null;\n                _pendingDurabilityCompletion = null;\n            }\n\n            // Replication proof is recorded before the waiting submit task resumes.\n            // ActionCommitted remains the local authoritative-commit signal; DurabilityAdvanced is the replication-safe signal.\n            if (completion != null) completion.TrySetResult(true);\n\n            var handler = DurabilityAdvanced;\n            if (handler != null)\n                handler(new SolarDurabilityAdvance(_requiredReplicationPeerId, durableCommit.NextTurnIndex, durableCommit.StateHash));'''
          replace_once(old, new, 'revalidation ACK handling')
          durability.write_text(text)

          epoch = Path('Packages/com.hoonex.solarnet/Runtime/Session/SolarAuthorityEpoch.cs')
          text = epoch.read_text()
          old = '''            var game = new SolarTurnSession(\n                record.RoomSnapshot.GameSessionId,\n                record.RoomSnapshot.HostPeerId,\n                transport,\n                coordinator,\n                gameStateMachine,\n                journalCapacity,\n                string.IsNullOrWhiteSpace(record.RequiredReplicationPeerId)\n                    ? null\n                    : record.RequiredReplicationPeerId);\n            var start = new SolarGameStartInfo('''
          new = '''            var game = new SolarTurnSession(\n                record.RoomSnapshot.GameSessionId,\n                record.RoomSnapshot.HostPeerId,\n                transport,\n                coordinator,\n                gameStateMachine,\n                journalCapacity,\n                string.IsNullOrWhiteSpace(record.RequiredReplicationPeerId)\n                    ? null\n                    : record.RequiredReplicationPeerId);\n            if (!string.IsNullOrWhiteSpace(record.RequiredReplicationPeerId))\n                game.RequireDurabilityRevalidation(checkpoint.NextTurnIndex, checkpoint.StateHash);\n            var start = new SolarGameStartInfo('''
          if text.count(old) != 1:
              raise SystemExit(f'epoch resume revalidation: expected 1 match, got {text.count(old)}')
          epoch.write_text(text.replace(old, new, 1))

          test = Path('tests/SolarNet.AuthorityEpochResume.SmokeTests/Program.cs')
          text = test.read_text()
          old = '''            resumed.RoomSession.Attach();\n            resumed.GameSession.ProtocolFaulted += faults.Add;\n            await resumed.GameSession.StartAsync().ConfigureAwait(false);'''
          new = '''            resumed.RoomSession.Attach();\n            resumed.GameSession.ProtocolFaulted += faults.Add;\n            var preProofRejection = new TaskCompletionSource<SolarTurnRejection>(TaskCreationOptions.RunContinuationsAsynchronously);\n            replica.ActionRejected += rejection => preProofRejection.TrySetResult(rejection);\n            await resumed.GameSession.StartAsync().ConfigureAwait(false);'''
          if text.count(old) != 1:
              raise SystemExit('test rejection signal match failed')
          text = text.replace(old, new, 1)

          old = '''            var recaptured = SolarAuthorityEpochPersistence.Capture(\n                resumed.RoomSession.CurrentSnapshot,\n                resumed.GameSession,\n                resumedState);\n            Equal(4L, recaptured.GameCheckpoint.NextTurnIndex, "immediate post-resume recapture frontier");\n\n            await replica.RequestResyncAsync(4).ConfigureAwait(false);\n            await WaitUntilAsync(\n                () => resumed.GameSession.GetReplicationFrontier("host") >= 4,\n                "replica proof after restored-host snapshot").ConfigureAwait(false);'''
          new = '''            var recaptured = SolarAuthorityEpochPersistence.Capture(\n                resumed.RoomSession.CurrentSnapshot,\n                resumed.GameSession,\n                resumedState);\n            Equal(4L, recaptured.GameCheckpoint.NextTurnIndex, "immediate post-resume recapture frontier");\n            True(resumed.GameSession.DurabilityRevalidationPending, "restored host requires replica revalidation before accepting turns");\n\n            await replica.SubmitActionAsync("add", EncodeInt(99)).ConfigureAwait(false);\n            var rejected = await WaitAsync(preProofRejection.Task, "pre-proof replication-pending rejection").ConfigureAwait(false);\n            Equal(SolarTurnRejectReason.ReplicationPending, rejected.Reason, "pre-proof action rejection reason");\n            Equal(4L, resumed.GameSession.KnownNextTurnIndex, "pre-proof action cannot advance restored authority");\n            Equal(12, resumedState.Value, "pre-proof action cannot mutate restored state");\n\n            await replica.RequestResyncAsync(4).ConfigureAwait(false);\n            await WaitUntilAsync(\n                () => !resumed.GameSession.DurabilityRevalidationPending && resumed.GameSession.GetReplicationFrontier("host") >= 4,\n                "replica proof after restored-host snapshot").ConfigureAwait(false);'''
          if text.count(old) != 1:
              raise SystemExit('test pre-proof fence match failed')
          test.write_text(text.replace(old, new, 1))
      - name: Verify revalidation fence and regressions
        run: |
          dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
          dotnet build tests/SolarNet.GridDuel.UnityCompile/SolarNet.GridDuel.UnityCompile.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.AuthorityEpochResume.SmokeTests/SolarNet.AuthorityEpochResume.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.DurabilityBarrier.SmokeTests/SolarNet.DurabilityBarrier.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.ReplicationAck.SmokeTests/SolarNet.ReplicationAck.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.ProcessResume.SmokeTests/SolarNet.ProcessResume.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
      - name: Publish bounded revalidation patch
        run: |
          git rm .github/workflows/m20-resume-revalidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.Durability.cs Packages/com.hoonex.solarnet/Runtime/Session/SolarAuthorityEpoch.cs tests/SolarNet.AuthorityEpochResume.SmokeTests/Program.cs
          git commit -m "Fence resumed authority until replica revalidation"
          git push origin HEAD:feat/authority-epoch-persistence
