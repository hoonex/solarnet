name: M18 Replication ACK Patch

on:
  push:
    branches:
      - feat/replication-ack
    paths:
      - .github/workflows/m18-replication-ack-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact mission base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "30ea51d3d6379a3ba01aacd16a0dcb8e0f731d6a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m18-replication-ack-patch.yml"
      - name: Patch SolarTurnSession owner
        shell: python
        run: |
          from pathlib import Path
          p = Path('Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.cs')
          text = p.read_text(encoding='utf-8')
          patches = [
              ('    public sealed class SolarTurnSession\n', '    public sealed partial class SolarTurnSession\n'),
              ('            if (!IsHost && _hostCoordinator != null)\n                throw new ArgumentException("Only the host session may own the TurnCoordinator.", nameof(hostCoordinator));\n\n            if (IsHost)\n', '            if (!IsHost && _hostCoordinator != null)\n                throw new ArgumentException("Only the host session may own the TurnCoordinator.", nameof(hostCoordinator));\n\n            InitializeReplicationAcknowledgements(journalCapacity);\n\n            if (IsHost)\n'),
              ('                    else if (packet.Type == SolarPacketType.ResyncRequest)\n                    {\n                        await HandleResyncRequestAsHostAsync(packet, CancellationToken.None).ConfigureAwait(false);\n                    }\n                    return;\n', '                    else if (packet.Type == SolarPacketType.ResyncRequest)\n                    {\n                        await HandleResyncRequestAsHostAsync(packet, CancellationToken.None).ConfigureAwait(false);\n                    }\n                    else if (packet.Type == SolarPacketType.ReplicationAck)\n                    {\n                        HandleReplicationAcknowledgementAsHost(packet);\n                    }\n                    return;\n')
          ]
          for old, new in patches:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one patch match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Verify replication ACK surface
        run: |
          set -euo pipefail
          dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.ReplicationAck.SmokeTests/SolarNet.ReplicationAck.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.StateIntegrity.SmokeTests/SolarNet.StateIntegrity.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
      - name: Publish bounded patch
        run: |
          set -euo pipefail
          rm .github/workflows/m18-replication-ack-patch.yml
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx '.github/workflows/m18-replication-ack-patch.yml'
          git diff --cached --name-only | grep -Fx 'Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.cs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire replication acknowledgements into turn sessions'
          git push origin HEAD:feat/replication-ack
