name: Relay Siege Bluetooth

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bluetooth-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prove per-connection send FIFO
        run: |
          rm -rf /tmp/solarnet-bt-fifo && mkdir -p /tmp/solarnet-bt-fifo
          javac -d /tmp/solarnet-bt-fifo \
            Packages/com.hoonex.solarnet/Plugins/Android/SolarNetBluetoothClassic.androidlib/src/main/java/com/hoonex/solarnet/bluetoothclassic/SolarSerialTaskQueue.java \
            android-smoke/probe-tests/SolarSerialTaskQueueSmoke.java
          java -cp /tmp/solarnet-bt-fifo com.hoonex.solarnet.bluetoothclassic.SolarSerialTaskQueueSmoke
      - name: Prove Relay Siege authority, dedup and reconnect
        run: |
          rm -rf /tmp/relay-siege-bt && mkdir -p /tmp/relay-siege-bt
          javac -d /tmp/relay-siege-bt \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeCards.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeGame.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeNetworkState.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeNetworkStateCodec.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeBluetoothProtocol.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/RelaySiegeBluetoothSession.java \
            android-smoke/game-tests/RelaySiegeBluetoothSessionSmoke.java
          java -cp /tmp/relay-siege-bt com.hoonex.solarnet.gridduel.RelaySiegeBluetoothSessionSmoke
