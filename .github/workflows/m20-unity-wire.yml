name: M20 Unity Persistence Wire

on:
  push:
    branches:
      - feat/authority-epoch-persistence

permissions:
  contents: write

jobs:
  wire-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authority-epoch-persistence
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact mission base
        run: test "$(git rev-parse HEAD)" = "837b6a3c9fe0ffa889b384dcdb35c154a1470d5d"
      - name: Wire Grid Duel persistence lifecycle
        shell: python
        run: |
          from pathlib import Path

          main = Path('Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.cs')
          text = main.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        private void Awake()\n        {\n            AddLog("Networked Grid Duel loaded.");',
              '        private void Awake()\n        {\n            LoadPersistedAuthorityMetadata();\n            AddLog("Networked Grid Duel loaded.");',
              'Awake load')

          replace_once(
              '        private void DrawSetup()\n        {\n            GUILayout.Label("1. Role");',
              '        private void DrawSetup()\n        {\n            DrawPersistedAuthorityControls();\n            GUILayout.Label("1. Role");',
              'DrawSetup persistence controls')

          replace_once(
              '            GUI.enabled = !_busy;\n            if (GUILayout.Button(_isHost ? "HOST ✓" : "Host")) _isHost = true;',
              '            GUI.enabled = !_busy && !HasPersistedAuthorityBlob;\n            if (GUILayout.Button(_isHost ? "HOST ✓" : "Host")) _isHost = true;',
              'role fence')

          replace_once(
              '            if (!_isHost) GUILayout.Label("Client peer identity persists across app restarts for active-match resume.");\n            if (GUILayout.Button("Request Android permissions", GUILayout.Height(38f))) RequestAndroidPermissions();\n            if (GUILayout.Button(_isHost ? "Start Grid Duel host" : "Start Grid Duel client", GUILayout.Height(46f))) StartNetworkedMatch();',
              '            if (!_isHost) GUILayout.Label("Client peer identity persists across app restarts for active-match resume.");\n            GUI.enabled = !_busy;\n            if (GUILayout.Button("Request Android permissions", GUILayout.Height(38f))) RequestAndroidPermissions();\n            GUI.enabled = !_busy && !HasPersistedAuthorityBlob;\n            if (GUILayout.Button(_isHost ? "Start Grid Duel host" : "Start Grid Duel client", GUILayout.Height(46f))) StartNetworkedMatch();',
              'fresh start fence')

          replace_once(
              '        private async void StartNetworkedMatch()\n        {\n            if (_busy || _started) return;\n            _busy = true;',
              '        private async void StartNetworkedMatch()\n        {\n            if (_busy || _started) return;\n            if (HasPersistedAuthorityBlob)\n            {\n                _status = "Resume or discard the saved authority epoch before starting a new match.";\n                return;\n            }\n            _busy = true;',
              'start guard')

          replace_once(
              '            return !_busy && _game != null && _gameState != null && !_gameState.IsFinished &&\n                   string.Equals(_game.KnownCurrentPlayerId, _localPeerId, StringComparison.Ordinal);',
              '            return !_busy && !_authorityResumeAwaitingReplicaProof && _game != null && _gameState != null && !_gameState.IsFinished &&\n                   string.Equals(_game.KnownCurrentPlayerId, _localPeerId, StringComparison.Ordinal);',
              'input proof gate')

          replace_once(
              '                SubscribeGame(_game);\n                await _game.StartAsync();\n\n                if (!_isHost && _resumeFromProcessRestart)',
              '                SubscribeGame(_game);\n                await _game.StartAsync();\n                if (_isHost) PersistCurrentAuthorityEpoch("game start");\n\n                if (!_isHost && _resumeFromProcessRestart)',
              'initial authority save')

          replace_once(
              '                await ShutdownAsync();\n                _status = "Stopped.";',
              '                await ShutdownAsync();\n                ClearPersistedAuthorityEpoch();\n                _status = "Stopped.";',
              'explicit stop clears save')

          replace_once(
              '            _resumeFromProcessRestart = false;\n            ClearMigrationRuntimeState();',
              '            _resumeFromProcessRestart = false;\n            _authorityResumeAwaitingReplicaProof = false;\n            _authorityResumeProofTurn = 0;\n            ClearMigrationRuntimeState();',
              'runtime proof reset')

          main.write_text(text)

          migration = Path('Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.Migration.cs')
          text = migration.read_text()

          def mreplace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          mreplace(
              '            game.ResyncFailed += failure => AddLog("Resync failed: " + failure.Reason);\n            game.ProtocolFaulted += ex => AddLog("Game fault: " + ex.Message);',
              '            game.ResyncFailed += failure => AddLog("Resync failed: " + failure.Reason);\n            game.DurabilityAdvanced += OnDurabilityAdvancedForPersistence;\n            game.ReplicationAcknowledged += OnReplicationAcknowledgedForAuthorityResume;\n            game.ProtocolFaulted += ex => AddLog("Game fault: " + ex.Message);',
              'game persistence events')

          mreplace(
              '                SubscribeGame(_game);\n                await _game.StartAsync();\n                _resumeFromProcessRestart = false;\n                migrationReady = true;',
              '                SubscribeGame(_game);\n                await _game.StartAsync();\n                _resumeFromProcessRestart = false;\n                if (_isHost) PersistCurrentAuthorityEpoch("authority migration");\n                else ClearPersistedAuthorityEpoch();\n                migrationReady = true;',
              'migration persistence transition')

          migration.write_text(text)
      - name: Verify M20 Unity and engine surfaces
        run: |
          dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
          dotnet build tests/SolarNet.GridDuel.UnityCompile/SolarNet.GridDuel.UnityCompile.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.AuthorityEpochResume.SmokeTests/SolarNet.AuthorityEpochResume.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.DurabilityBarrier.SmokeTests/SolarNet.DurabilityBarrier.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.ProcessResume.SmokeTests/SolarNet.ProcessResume.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuel.SmokeTests/SolarNet.GridDuel.SmokeTests.csproj --configuration Release --nologo
      - name: Publish bounded Unity wire
        run: |
          git rm .github/workflows/m20-unity-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.cs Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.Migration.cs
          git commit -m "Wire Grid Duel durable authority resume"
          git push origin HEAD:feat/authority-epoch-persistence
