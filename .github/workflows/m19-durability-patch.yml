name: M19 Durability Barrier Patch

on:
  push:
    branches:
      - feat/durable-replication-barrier

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact mission base
        run: |
          test "$(git rev-parse HEAD^)" = "4940d275a42375dff035640d77bcf2020fdda1c6"
      - name: Patch durability owners
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'Packages/com.hoonex.solarnet/Runtime/Turns/TurnCoordinator.cs',
              '        GameRuleRejected = 7\n',
              '        GameRuleRejected = 7,\n        ReplicationPending = 8\n')

          session = 'Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.cs'
          replace_once(
              session,
              '            ISolarGameStateMachine gameStateMachine = null,\n            int journalCapacity = 256)\n',
              '            ISolarGameStateMachine gameStateMachine = null,\n            int journalCapacity = 256,\n            string requiredReplicationPeerId = null)\n')
          replace_once(
              session,
              '            InitializeReplicationAcknowledgements(journalCapacity);\n\n            if (IsHost)\n',
              '            InitializeReplicationAcknowledgements(journalCapacity);\n            InitializeDurabilityBarrier(requiredReplicationPeerId);\n\n            if (IsHost)\n')

          old_commit = '''        private async Task CommitAsHostAsync(SolarTurnAction action, CancellationToken cancellationToken)\n        {\n            await _hostGate.WaitAsync(cancellationToken).ConfigureAwait(false);\n            try\n            {\n                SolarTurnCommit commit;\n                SolarTurnRejectReason reason;\n                Func<SolarTurnAction, bool> validator = null;\n                if (_gameStateMachine != null)\n                {\n                    validator = candidate => _gameStateMachine.TryApply(new SolarGameAction(\n                        candidate.ActorId,\n                        candidate.ExpectedTurnIndex,\n                        candidate.ActionKind,\n                        candidate.Payload));\n                }\n\n                if (!_hostCoordinator.TryCommit(action, validator, out commit, out reason))\n                {\n                    await RejectAsHostAsync(action.ActorId, reason, cancellationToken).ConfigureAwait(false);\n                    return;\n                }\n\n                var stateHash = _gameStateMachine == null ? string.Empty : CaptureStateHash();\n                commit = commit.WithStateHash(stateHash);\n                _journal.Add(commit);\n                SetKnownState(commit.NextTurnIndex, commit.NextPlayerId, commit.Round, stateHash);\n                RaiseCommitted(commit);\n\n                var committedPacket = CreateCommittedPacket(commit);\n                await _transport.BroadcastAsync(SolarPacketCodec.Encode(committedPacket), cancellationToken).ConfigureAwait(false);\n            }\n            finally\n            {\n                _hostGate.Release();\n            }\n        }\n'''
          new_commit = '''        private async Task CommitAsHostAsync(SolarTurnAction action, CancellationToken cancellationToken)\n        {\n            Task durabilityTask = Task.CompletedTask;\n            await _hostGate.WaitAsync(cancellationToken).ConfigureAwait(false);\n            try\n            {\n                if (HasPendingDurabilityCommit())\n                {\n                    await RejectAsHostAsync(action.ActorId, SolarTurnRejectReason.ReplicationPending, cancellationToken).ConfigureAwait(false);\n                    return;\n                }\n\n                SolarTurnCommit commit;\n                SolarTurnRejectReason reason;\n                Func<SolarTurnAction, bool> validator = null;\n                if (_gameStateMachine != null)\n                {\n                    validator = candidate => _gameStateMachine.TryApply(new SolarGameAction(\n                        candidate.ActorId,\n                        candidate.ExpectedTurnIndex,\n                        candidate.ActionKind,\n                        candidate.Payload));\n                }\n\n                if (!_hostCoordinator.TryCommit(action, validator, out commit, out reason))\n                {\n                    await RejectAsHostAsync(action.ActorId, reason, cancellationToken).ConfigureAwait(false);\n                    return;\n                }\n\n                var stateHash = _gameStateMachine == null ? string.Empty : CaptureStateHash();\n                commit = commit.WithStateHash(stateHash);\n                _journal.Add(commit);\n                SetKnownState(commit.NextTurnIndex, commit.NextPlayerId, commit.Round, stateHash);\n                durabilityTask = BeginDurabilityBarrier(commit);\n                RaiseCommitted(commit);\n\n                var committedPacket = CreateCommittedPacket(commit);\n                await _transport.BroadcastAsync(SolarPacketCodec.Encode(committedPacket), cancellationToken).ConfigureAwait(false);\n            }\n            finally\n            {\n                _hostGate.Release();\n            }\n\n            await WaitForDurabilityAsync(durabilityTask, cancellationToken).ConfigureAwait(false);\n        }\n'''
          replace_once(session, old_commit, new_commit)

          durability = 'Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.Durability.cs'
          replace_once(
              durability,
              '            // The proof is durable before user callbacks run. Continuations are asynchronous,\n            // so the submitting host task cannot re-enter the turn gate from this callback stack.\n            if (completion != null) completion.TrySetResult(true);\n            RaiseCommitted(durableCommit);\n\n            var handler = DurabilityAdvanced;\n',
              '            // Replication proof is recorded before the waiting submit task resumes.\n            // ActionCommitted remains the local authoritative-commit signal; DurabilityAdvanced is the replication-safe signal.\n            if (completion != null) completion.TrySetResult(true);\n\n            var handler = DurabilityAdvanced;\n')

          authority = 'Packages/com.hoonex.solarnet/Runtime/Session/SolarAuthorityCheckpoint.cs'
          replace_once(
              authority,
              '            ISolarGameStateMachine gameStateMachine,\n            int journalCapacity = 256)\n',
              '            ISolarGameStateMachine gameStateMachine,\n            int journalCapacity = 256,\n            string requiredReplicationPeerId = null)\n')
          replace_once(
              authority,
              '                gameStateMachine,\n                journalCapacity);\n',
              '                gameStateMachine,\n                journalCapacity,\n                requiredReplicationPeerId);\n')

          grid = 'Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.cs'
          replace_once(
              grid,
              '''                _gameState = new GridDuelStateMachine(_playerAId, _playerBId);\n                _game = new SolarTurnSession(\n                    info.GameSessionId,\n                    info.HostPeerId,\n                    _transport,\n                    _isHost ? info.CreateHostTurnCoordinator() : null,\n                    _gameState);\n''',
              '''                _gameState = new GridDuelStateMachine(_playerAId, _playerBId);\n                var requiredReplica = _isHost\n                    ? (string.Equals(_playerAId, _localPeerId, StringComparison.Ordinal) ? _playerBId : _playerAId)\n                    : null;\n                _game = new SolarTurnSession(\n                    info.GameSessionId,\n                    info.HostPeerId,\n                    _transport,\n                    _isHost ? info.CreateHostTurnCoordinator() : null,\n                    _gameState,\n                    256,\n                    requiredReplica);\n''')

          migration = 'Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelMigrationWorkflow.cs'
          replace_once(
              migration,
              '                    gameState,\n                    journalCapacity);\n',
              '                    gameState,\n                    journalCapacity,\n                    migration.SourceRoom.HostPeerId);\n')

          migration_test = 'tests/SolarNet.GridDuelMigration.SmokeTests/Program.cs'
          replace_once(
              migration_test,
              '''        fixture.HostGame = new SolarTurnSession(\n            hostStart.GameSessionId,\n            hostStart.HostPeerId,\n            fixture.HostTransport,\n            hostStart.CreateHostTurnCoordinator(),\n            fixture.HostState);\n''',
              '''        fixture.HostGame = new SolarTurnSession(\n            hostStart.GameSessionId,\n            hostStart.HostPeerId,\n            fixture.HostTransport,\n            hostStart.CreateHostTurnCoordinator(),\n            fixture.HostState,\n            256,\n            "client");\n''')
          replace_once(
              migration_test,
              '            True(successorGame.IsHost, "successor owns promoted game authority");\n            True(!formerHostGame.IsHost, "former host is fenced to client role");\n',
              '            True(successorGame.IsHost, "successor owns promoted game authority");\n            True(successorGame.DurabilityBarrierEnabled, "promoted successor keeps a durability barrier");\n            Equal("host", successorGame.RequiredReplicationPeerId, "former host becomes the promoted authority replica");\n            True(!formerHostGame.IsHost, "former host is fenced to client role");\n')

          durability_test = 'tests/SolarNet.DurabilityBarrier.SmokeTests/Program.cs'
          replace_once(
              durability_test,
              '            Equal(0, committed, "host commit callback before ACK");\n',
              '            Equal(1, committed, "local authoritative commit callback occurs before durability ACK");\n')
          replace_once(
              durability_test,
              '            Equal(1, committed, "host publishes commit exactly once after ACK");\n',
              '            Equal(1, committed, "durability ACK does not duplicate the local commit callback");\n')
          PY
      - name: Verify durability barrier surface
        run: |
          dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.DurabilityBarrier.SmokeTests/SolarNet.DurabilityBarrier.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.ReplicationAck.SmokeTests/SolarNet.ReplicationAck.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.StateIntegrity.SmokeTests/SolarNet.StateIntegrity.SmokeTests.csproj --configuration Release --nologo
          dotnet build tests/SolarNet.GridDuel.UnityCompile/SolarNet.GridDuel.UnityCompile.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
      - name: Publish bounded patch
        run: |
          rm .github/workflows/m19-durability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/com.hoonex.solarnet/Runtime/Turns/TurnCoordinator.cs \
                  Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.cs \
                  Packages/com.hoonex.solarnet/Runtime/Session/SolarTurnSession.Durability.cs \
                  Packages/com.hoonex.solarnet/Runtime/Session/SolarAuthorityCheckpoint.cs \
                  Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.cs \
                  Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelMigrationWorkflow.cs \
                  tests/SolarNet.GridDuelMigration.SmokeTests/Program.cs \
                  tests/SolarNet.DurabilityBarrier.SmokeTests/Program.cs \
                  .github/workflows/m19-durability-patch.yml
          git commit -m "Wire designated-replica durability fence"
          git push origin HEAD:feat/durable-replication-barrier
