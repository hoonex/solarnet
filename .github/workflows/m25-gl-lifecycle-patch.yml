name: M25 Pulse Hockey GL Lifecycle

on:
  push:
    branches:
      - feat/pulse-hockey-3d

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply bounded OpenGL lifecycle patch
        run: python3 .github/m25-gl-lifecycle.py
      - name: Run Pulse Hockey rules and fairness smoke
        run: |
          rm -rf /tmp/pulse-hockey && mkdir -p /tmp/pulse-hockey
          javac -d /tmp/pulse-hockey \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/PulseHockeyGame.java \
            android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/PulseHockeyAi.java \
            android-smoke/game-tests/PulseHockeyGameSmoke.java
          java -cp /tmp/pulse-hockey com.hoonex.solarnet.gridduel.PulseHockeyGameSmoke
      - name: Ensure Android 36 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Solar Arcade APK with lifecycle fix
        run: gradle -p android-smoke :grid-duel-game:assembleDebug --no-daemon --stacktrace
      - name: Publish verified lifecycle fix and self-clean mission
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/PulseHockey3DView.java
          git rm .github/m25-gl-lifecycle.py .github/workflows/m25-gl-lifecycle-patch.yml
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            '.github/m25-gl-lifecycle.py' \
            '.github/workflows/m25-gl-lifecycle-patch.yml' \
            'android-smoke/grid-duel-game/src/main/java/com/hoonex/solarnet/gridduel/PulseHockey3DView.java' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m "Stop detached Pulse Hockey GL renderers"
          git push origin HEAD:feat/pulse-hockey-3d
