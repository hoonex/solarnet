name: M17 Grid Duel Auto Migration Patch

on:
  push:
    branches:
      - feat/gridduel-auto-host-migration
    paths:
      - .github/workflows/m17-gridduel-auto-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify bounded mission input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cac5451ceb6a803bf1528933bd9159026aac1f9e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m17-gridduel-auto-migration.yml"

      - name: Apply M17 structural patches
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Transport switches must let callers subscribe before Start/Connect can emit events.
          replace_one(
              "Packages/com.hoonex.solarnet/Runtime/Nearby/NearbyMigrationTransportSwitch.cs",
              "            NearbyConnectionStrategy strategy = NearbyConnectionStrategy.Star,\n            CancellationToken cancellationToken = default(CancellationToken))",
              "            NearbyConnectionStrategy strategy = NearbyConnectionStrategy.Star,\n            CancellationToken cancellationToken = default(CancellationToken),\n            Action<NearbyTransport> configureTransport = null)")
          replace_one(
              "Packages/com.hoonex.solarnet/Runtime/Nearby/NearbyMigrationTransportSwitch.cs",
              "            await next.StartAsync(cancellationToken).ConfigureAwait(false);",
              "            if (configureTransport != null) configureTransport(next);\n            await next.StartAsync(cancellationToken).ConfigureAwait(false);")

          replace_one(
              "Packages/com.hoonex.solarnet/Runtime/BluetoothClassic/BluetoothClassicMigrationTransportSwitch.cs",
              "            string serviceUuid = BluetoothClassicTransportOptions.DefaultServiceUuid,\n            CancellationToken cancellationToken = default(CancellationToken))",
              "            string serviceUuid = BluetoothClassicTransportOptions.DefaultServiceUuid,\n            CancellationToken cancellationToken = default(CancellationToken),\n            Action<BluetoothClassicTransport> configureTransport = null)")
          replace_one(
              "Packages/com.hoonex.solarnet/Runtime/BluetoothClassic/BluetoothClassicMigrationTransportSwitch.cs",
              "            await next.StartAsync(cancellationToken).ConfigureAwait(false);",
              "            if (configureTransport != null) configureTransport(next);\n            await next.StartAsync(cancellationToken).ConfigureAwait(false);")

          # Preserve authenticated RFCOMM device identity long enough to rebuild topology.
          bt = "Packages/com.hoonex.solarnet/Runtime/BluetoothClassic/BluetoothClassicTransport.cs"
          replace_one(
              bt,
              "        private readonly Dictionary<string, string> _connectionToPeer = new Dictionary<string, string>(StringComparer.Ordinal);\n        private readonly Dictionary<string, string> _peerToConnection = new Dictionary<string, string>(StringComparer.Ordinal);",
              "        private readonly Dictionary<string, string> _connectionToPeer = new Dictionary<string, string>(StringComparer.Ordinal);\n        private readonly Dictionary<string, string> _peerToConnection = new Dictionary<string, string>(StringComparer.Ordinal);\n        private readonly Dictionary<string, string> _connectionToDeviceAddress = new Dictionary<string, string>(StringComparer.Ordinal);\n        private readonly Dictionary<string, string> _peerToLastDeviceAddress = new Dictionary<string, string>(StringComparer.Ordinal);")
          replace_one(
              bt,
              "                    _connectionToPeer.Clear();\n                    _peerToConnection.Clear();",
              "                    _connectionToPeer.Clear();\n                    _peerToConnection.Clear();\n                    _connectionToDeviceAddress.Clear();\n                    _peerToLastDeviceAddress.Clear();")
          replace_one(
              bt,
              "        public IReadOnlyList<BluetoothClassicDevice> GetBondedDevices()\n        {\n            return _adapter.GetBondedDevices();\n        }",
              "        public IReadOnlyList<BluetoothClassicDevice> GetBondedDevices()\n        {\n            return _adapter.GetBondedDevices();\n        }\n\n        public bool TryGetLastKnownDeviceAddress(string remotePeerId, out string deviceAddress)\n        {\n            deviceAddress = null;\n            if (string.IsNullOrWhiteSpace(remotePeerId)) return false;\n            lock (_gate) return _peerToLastDeviceAddress.TryGetValue(remotePeerId, out deviceAddress);\n        }")
          replace_one(
              bt,
              "        private void OnConnected(string connectionId, string deviceAddress, string deviceName)\n        {\n            SendHelloAsync(connectionId);\n        }",
              "        private void OnConnected(string connectionId, string deviceAddress, string deviceName)\n        {\n            if (!string.IsNullOrWhiteSpace(connectionId) && !string.IsNullOrWhiteSpace(deviceAddress))\n            {\n                lock (_gate)\n                {\n                    _connectionToDeviceAddress[connectionId] = deviceAddress;\n                    string peerId;\n                    if (_connectionToPeer.TryGetValue(connectionId, out peerId))\n                        _peerToLastDeviceAddress[peerId] = deviceAddress;\n                }\n            }\n            SendHelloAsync(connectionId);\n        }")
          replace_one(
              bt,
              "            lock (_gate)\n            {\n                if (_connectionToPeer.TryGetValue(connectionId, out peerId))\n                {\n                    _connectionToPeer.Remove(connectionId);",
              "            lock (_gate)\n            {\n                _connectionToDeviceAddress.Remove(connectionId);\n                if (_connectionToPeer.TryGetValue(connectionId, out peerId))\n                {\n                    _connectionToPeer.Remove(connectionId);")
          replace_one(
              bt,
              "                _connectionToPeer[connectionId] = peerId;\n                _peerToConnection[peerId] = connectionId;\n                newlyBound = true;",
              "                _connectionToPeer[connectionId] = peerId;\n                _peerToConnection[peerId] = connectionId;\n                string deviceAddress;\n                if (_connectionToDeviceAddress.TryGetValue(connectionId, out deviceAddress) && !string.IsNullOrWhiteSpace(deviceAddress))\n                    _peerToLastDeviceAddress[peerId] = deviceAddress;\n                newlyBound = true;")

          demo = "Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.cs"
          replace_one(demo, "    public sealed class GridDuelNetworkedDemo : MonoBehaviour", "    public sealed partial class GridDuelNetworkedDemo : MonoBehaviour")
          replace_one(demo, "            var adapter = new AndroidNearbyAdapter();\n            _nativeAdapter = adapter;", "            var adapter = new AndroidNearbyAdapter();\n            _nativeAdapter = adapter;\n            _nearbyAdapter = adapter;")
          replace_one(
              demo,
              "            _nearbyTransport.EndpointDiscovered += OnNearbyEndpointFound;\n            _nearbyTransport.EndpointLost += OnNearbyEndpointLost;\n            _nearbyTransport.ConnectionVerificationRequired += OnNearbyVerificationRequired;\n            _nearbyTransport.PeerConnected += OnPeerConnected;\n            _nearbyTransport.PeerDisconnected += OnPeerDisconnected;\n            _nearbyTransport.Faulted += OnTransportFault;",
              "            SubscribeNearbyTransport(_nearbyTransport);")
          replace_one(demo, "            var adapter = new AndroidBluetoothClassicAdapter();\n            _nativeAdapter = adapter;", "            var adapter = new AndroidBluetoothClassicAdapter();\n            _nativeAdapter = adapter;\n            _bluetoothAdapter = adapter;")
          replace_one(
              demo,
              "            _bluetoothTransport.PeerConnected += OnPeerConnected;\n            _bluetoothTransport.PeerDisconnected += OnPeerDisconnected;\n            _bluetoothTransport.Faulted += OnTransportFault;",
              "            SubscribeBluetoothTransport(_bluetoothTransport);")
          replace_one(
              demo,
              '''        private async void OnPeerConnected(string peerId)\n        {\n            _status = "Connected: " + peerId;\n            AddLog(_status);\n            try\n            {\n                if (_room != null) await _room.NotifyPeerConnectedAsync(peerId);\n                if (!_isHost && _game != null && string.Equals(peerId, HostPeerId, StringComparison.Ordinal))\n                {\n                    await _game.RequestResyncAsync();\n                    AddLog("Requested game-state resync after live-link reconnect.");\n                }\n            }\n            catch (Exception ex)\n            {\n                AddLog("Reconnect/join error: " + ex.Message);\n            }\n        }''',
              '''        private async void OnPeerConnected(string peerId)\n        {\n            await HandlePeerConnectedAsync(peerId);\n        }''')
          replace_one(
              demo,
              '''        private async void OnPeerDisconnected(string peerId)\n        {\n            _status = "Opponent disconnected.";\n            AddLog(_status);\n            try\n            {\n                if (_room != null) await _room.NotifyPeerDisconnectedAsync(peerId);\n            }\n            catch (Exception ex)\n            {\n                AddLog("Room disconnect error: " + ex.Message);\n            }\n        }''',
              '''        private async void OnPeerDisconnected(string peerId)\n        {\n            if (await TryHandleMigrationDisconnectAsync(peerId)) return;\n            await HandleOrdinaryPeerDisconnectedAsync(peerId);\n        }''')
          replace_one(
              demo,
              "        private void OnNearbyEndpointFound(NearbyEndpoint endpoint)\n        {\n            _nearbyEndpoints[endpoint.EndpointId] = new NearbyEndpointView { Id = endpoint.EndpointId, Name = endpoint.EndpointName };\n        }",
              "        private void OnNearbyEndpointFound(NearbyEndpoint endpoint)\n        {\n            HandleNearbyEndpointFoundForMigration(endpoint);\n        }")
          replace_one(
              demo,
              "        private void OnNearbyEndpointLost(string endpointId)\n        {\n            _nearbyEndpoints.Remove(endpointId);\n        }",
              "        private void OnNearbyEndpointLost(string endpointId)\n        {\n            HandleNearbyEndpointLostForMigration(endpointId);\n        }")
          replace_one(
              demo,
              '''                _game.ActionCommitted += OnActionCommitted;\n                _game.ActionRejected += rejection => AddLog("Turn rejected: " + rejection.Reason);\n                _game.StateMismatchDetected += mismatch => AddLog("State mismatch: " + mismatch.Reason + ". Automatic resync is active.");\n                _game.SnapshotApplied += snapshot => AddLog("State snapshot applied at turn " + snapshot.NextTurnIndex + ".");\n                _game.ResyncFailed += failure => AddLog("Resync failed: " + failure.Reason);\n                _game.ProtocolFaulted += ex => AddLog("Game fault: " + ex.Message);''',
              "                SubscribeGame(_game);")
          replace_one(
              demo,
              "            _sawLobbyBeforePlaying = false;\n            _resumeFromProcessRestart = false;\n        }",
              "            _sawLobbyBeforePlaying = false;\n            _resumeFromProcessRestart = false;\n            ClearMigrationRuntimeState();\n        }")

          # Grid Duel smoke tests consume the exact helper used by the Unity sample.
          replace_one(
              "tests/SolarNet.GridDuel.SmokeTests/SolarNet.GridDuel.SmokeTests.csproj",
              "    <Compile Include=\"../../Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelStateMachine.cs\" Link=\"GridDuelStateMachine.cs\" />",
              "    <Compile Include=\"../../Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelStateMachine.cs\" Link=\"GridDuelStateMachine.cs\" />\n    <Compile Include=\"../../Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelMigrationWorkflow.cs\" Link=\"GridDuelMigrationWorkflow.cs\" />")

          grid_tests = "tests/SolarNet.GridDuel.SmokeTests/Program.cs"
          replace_one(
              grid_tests,
              "            RoomLifecycleTransitionsIntoGridDuelMatch,\n            ActiveMatchReconnectReplaysMissingTurn",
              "            RoomLifecycleTransitionsIntoGridDuelMatch,\n            ActiveMatchReconnectReplaysMissingTurn,\n            SynchronizedLinkLossMigratesGridDuelAuthority,\n            DivergedStateBlocksMigrationPreparation")
          migration_tests = r'''
    private static async Task SynchronizedLinkLossMigratesGridDuelAuthority()
    {
        var fixture = await CreateStartedRoomGameAsync("grid-migration-room", "grid-migration-game").ConfigureAwait(false);
        SolarRoomMigrationBootstrap oldHostRoom = null;
        SolarRoomMigrationBootstrap successorRoom = null;
        SolarTurnSession oldHostGame = null;
        SolarTurnSession successorGame = null;
        try
        {
            await Move(fixture.HostGame, 1, 2).ConfigureAwait(false);
            await Move(fixture.ClientGame, 3, 2).ConfigureAwait(false);
            AssertConverged(fixture.HostState, fixture.ClientState, "before Grid Duel migration");

            var hostMigration = GridDuelMigrationWorkflow.Prepare(fixture.HostRoom.CurrentSnapshot, fixture.HostGame, fixture.HostState);
            var clientMigration = GridDuelMigrationWorkflow.Prepare(fixture.ClientRoom.CurrentSnapshot, fixture.ClientGame, fixture.ClientState);
            Equal("client", hostMigration.Plan.SuccessorPeerId, "slot-one Grid Duel successor");
            Equal(hostMigration.Plan.NextGameSessionId, clientMigration.Plan.NextGameSessionId, "both peers derive same Grid Duel migration epoch");
            Equal(hostMigration.Checkpoint.StateHash, clientMigration.Checkpoint.StateHash, "both peers capture same migration digest");

            fixture.HostRoom.Detach();
            fixture.ClientRoom.Detach();
            await fixture.ClientGame.StopAsync().ConfigureAwait(false);
            await fixture.HostGame.StopAsync().ConfigureAwait(false);

            var migratedHub = new LoopbackTransportHub();
            var oldHostTransport = migratedHub.CreateEndpoint("host");
            var successorTransport = migratedHub.CreateEndpoint("client");
            oldHostRoom = GridDuelMigrationWorkflow.CreateRoom(hostMigration, oldHostTransport);
            successorRoom = GridDuelMigrationWorkflow.CreateRoom(clientMigration, successorTransport);
            oldHostRoom.RoomSession.Attach();
            successorRoom.RoomSession.Attach();

            oldHostGame = GridDuelMigrationWorkflow.CreateGame(hostMigration, oldHostRoom, oldHostTransport, fixture.HostState);
            successorGame = GridDuelMigrationWorkflow.CreateGame(clientMigration, successorRoom, successorTransport, fixture.ClientState);
            var faults = new List<Exception>();
            var snapshots = 0;
            oldHostGame.ProtocolFaulted += faults.Add;
            successorGame.ProtocolFaulted += faults.Add;
            oldHostRoom.RoomSession.ProtocolFaulted += faults.Add;
            successorRoom.RoomSession.ProtocolFaulted += faults.Add;
            oldHostGame.SnapshotApplied += _ => snapshots++;

            await successorGame.StartAsync().ConfigureAwait(false);
            await oldHostGame.StartAsync().ConfigureAwait(false);
            await oldHostRoom.RoomSession.NotifyPeerConnectedAsync("client").ConfigureAwait(false);
            Equal(SolarRoomPhase.Playing, oldHostRoom.RoomSession.Phase, "former host rejoins migrated room as client");
            Equal("client", oldHostRoom.RoomSession.HostPeerId, "migrated room authority is slot one");
            True(successorGame.IsHost, "elected Grid Duel successor owns promoted authority");
            True(!oldHostGame.IsHost, "former Grid Duel host is fenced to client role");

            await oldHostGame.RequestResyncAsync(0).ConfigureAwait(false);
            Equal(1, snapshots, "former host receives promoted snapshot");
            Equal(2L, oldHostGame.KnownNextTurnIndex, "migrated snapshot preserves next turn");
            AssertConverged(fixture.ClientState, fixture.HostState, "after migrated Grid Duel resync");

            await Move(oldHostGame, 2, 2).ConfigureAwait(false);
            await Attack(successorGame).ConfigureAwait(false);
            Equal(4L, successorGame.KnownNextTurnIndex, "migrated Grid Duel continues canonical turns");
            Equal(2, fixture.HostState.GetPlayer("host").Health, "successor attack applies after authority rotation");
            AssertConverged(fixture.ClientState, fixture.HostState, "after migrated Grid Duel turns");
            Equal(0, faults.Count, "Grid Duel migration protocol faults");
        }
        finally
        {
            if (oldHostRoom != null) oldHostRoom.RoomSession.Detach();
            if (successorRoom != null) successorRoom.RoomSession.Detach();
            if (oldHostGame != null) await oldHostGame.StopAsync().ConfigureAwait(false);
            if (successorGame != null) await successorGame.StopAsync().ConfigureAwait(false);
            await fixture.DisposeAsync().ConfigureAwait(false);
        }
    }

    private static async Task DivergedStateBlocksMigrationPreparation()
    {
        var fixture = await CreateStartedRoomGameAsync("grid-migration-safety-room", "grid-migration-safety-game").ConfigureAwait(false);
        try
        {
            await Move(fixture.HostGame, 1, 2).ConfigureAwait(false);
            True(
                fixture.ClientState.TryApply(new SolarGameAction(
                    "client",
                    fixture.ClientGame.KnownNextTurnIndex,
                    GridDuelActionCodec.MoveAction,
                    GridDuelActionCodec.EncodeMove(3, 2))),
                "test must corrupt only the local reducer state");

            Throws<InvalidOperationException>(
                () => GridDuelMigrationWorkflow.Prepare(fixture.ClientRoom.CurrentSnapshot, fixture.ClientGame, fixture.ClientState),
                "diverged Grid Duel state must not produce an authority checkpoint");
        }
        finally
        {
            await fixture.DisposeAsync().ConfigureAwait(false);
        }
    }
'''
          replace_one(
              grid_tests,
              "    private static async Task<RoomGameFixture> CreateStartedRoomGameAsync(string roomId, string gameSessionId)",
              migration_tests + "\n    private static async Task<RoomGameFixture> CreateStartedRoomGameAsync(string roomId, string gameSessionId)")
          replace_one(
              grid_tests,
              "    private static void True(bool value, string label)\n    {\n        if (!value) throw new Exception(\"Expected true: \" + label);\n    }",
              "    private static void True(bool value, string label)\n    {\n        if (!value) throw new Exception(\"Expected true: \" + label);\n    }\n\n    private static void Throws<TException>(Action action, string label) where TException : Exception\n    {\n        try\n        {\n            action();\n        }\n        catch (TException)\n        {\n            return;\n        }\n        throw new Exception(\"Expected \" + typeof(TException).Name + \": \" + label);\n    }")

          # Prove configure callbacks run before switch Start/Connect boundaries.
          orch = "tests/SolarNet.MigrationOrchestration.SmokeTests/Program.cs"
          replace_one(
              orch,
              "        var successorAdapter = new FakeNearbyAdapter();\n        var oldSuccessor = new NearbyTransport(",
              "        var successorAdapter = new FakeNearbyAdapter();\n        var successorConfigured = false;\n        successorAdapter.StartConfiguredProbe = () => successorConfigured;\n        var oldSuccessor = new NearbyTransport(")
          replace_one(
              orch,
              "        var successor = await NearbyMigrationTransportSwitch.SwitchAsync(oldSuccessor, successorAdapter, source, plan, \"svc\");",
              "        var successor = await NearbyMigrationTransportSwitch.SwitchAsync(oldSuccessor, successorAdapter, source, plan, \"svc\", configureTransport: _ => successorConfigured = true);")
          replace_one(
              orch,
              "        var survivorAdapter = new FakeNearbyAdapter();\n        var oldSurvivor = new NearbyTransport(",
              "        var survivorAdapter = new FakeNearbyAdapter();\n        var survivorConfigured = false;\n        survivorAdapter.StartConfiguredProbe = () => survivorConfigured;\n        var oldSurvivor = new NearbyTransport(")
          replace_one(
              orch,
              "        var survivor = await NearbyMigrationTransportSwitch.SwitchAsync(oldSurvivor, survivorAdapter, source, plan, \"svc\");",
              "        var survivor = await NearbyMigrationTransportSwitch.SwitchAsync(oldSurvivor, survivorAdapter, source, plan, \"svc\", configureTransport: _ => survivorConfigured = true);")
          replace_one(
              orch,
              "        var reconnectAdapter = new FakeBluetoothAdapter();\n        var oldReconnect = new BluetoothClassicTransport(",
              "        var reconnectAdapter = new FakeBluetoothAdapter();\n        var reconnectConfigured = false;\n        reconnectAdapter.StartConfiguredProbe = () => reconnectConfigured;\n        reconnectAdapter.ConnectConfiguredProbe = () => reconnectConfigured;\n        var oldReconnect = new BluetoothClassicTransport(")
          replace_one(
              orch,
              '''        var survivorWithAddress = await BluetoothClassicMigrationTransportSwitch.SwitchAsync(\n            oldReconnect,\n            reconnectAdapter,\n            source,\n            plan,\n            "AA:BB:CC:DD:EE:FF");''',
              '''        var survivorWithAddress = await BluetoothClassicMigrationTransportSwitch.SwitchAsync(\n            oldReconnect,\n            reconnectAdapter,\n            source,\n            plan,\n            "AA:BB:CC:DD:EE:FF",\n            configureTransport: _ => reconnectConfigured = true);''')
          replace_one(
              orch,
              "        public string LastAdvertisingName;\n        public string LastRequestedEndpoint;",
              "        public string LastAdvertisingName;\n        public string LastRequestedEndpoint;\n        public Func<bool> StartConfiguredProbe;")
          replace_one(
              orch,
              "        { cancellationToken.ThrowIfCancellationRequested(); StartAdvertisingCount++; LastAdvertisingName = endpointName; return Task.CompletedTask; }\n        public Task StartDiscoveryAsync(string serviceId, string endpointName, NearbyConnectionStrategy strategy, CancellationToken cancellationToken = default(CancellationToken))\n        { cancellationToken.ThrowIfCancellationRequested(); StartDiscoveryCount++; return Task.CompletedTask; }",
              "        { cancellationToken.ThrowIfCancellationRequested(); EnsureConfigured(); StartAdvertisingCount++; LastAdvertisingName = endpointName; return Task.CompletedTask; }\n        public Task StartDiscoveryAsync(string serviceId, string endpointName, NearbyConnectionStrategy strategy, CancellationToken cancellationToken = default(CancellationToken))\n        { cancellationToken.ThrowIfCancellationRequested(); EnsureConfigured(); StartDiscoveryCount++; return Task.CompletedTask; }")
          replace_one(
              orch,
              "        public Task StopAllAsync(CancellationToken cancellationToken = default(CancellationToken))\n        { cancellationToken.ThrowIfCancellationRequested(); StopAllCount++; return Task.CompletedTask; }\n    }\n\n    private sealed class FakeBluetoothAdapter",
              "        public Task StopAllAsync(CancellationToken cancellationToken = default(CancellationToken))\n        { cancellationToken.ThrowIfCancellationRequested(); StopAllCount++; return Task.CompletedTask; }\n        private void EnsureConfigured()\n        {\n            if (StartConfiguredProbe != null && !StartConfiguredProbe()) throw new InvalidOperationException(\"Nearby transport started before caller configuration.\");\n        }\n    }\n\n    private sealed class FakeBluetoothAdapter")
          replace_one(
              orch,
              "        public int StopAllCount;\n        public string LastConnectAddress;",
              "        public int StopAllCount;\n        public string LastConnectAddress;\n        public Func<bool> StartConfiguredProbe;\n        public Func<bool> ConnectConfiguredProbe;")
          replace_one(
              orch,
              "        { cancellationToken.ThrowIfCancellationRequested(); StartServerCount++; return Task.CompletedTask; }\n        public Task ConnectAsync(string deviceAddress, string serviceUuid, CancellationToken cancellationToken = default(CancellationToken))\n        { cancellationToken.ThrowIfCancellationRequested(); ConnectCount++; LastConnectAddress = deviceAddress; return Task.CompletedTask; }",
              "        { cancellationToken.ThrowIfCancellationRequested(); if (StartConfiguredProbe != null && !StartConfiguredProbe()) throw new InvalidOperationException(\"Bluetooth transport started before caller configuration.\"); StartServerCount++; return Task.CompletedTask; }\n        public Task ConnectAsync(string deviceAddress, string serviceUuid, CancellationToken cancellationToken = default(CancellationToken))\n        { cancellationToken.ThrowIfCancellationRequested(); if (ConnectConfiguredProbe != null && !ConnectConfiguredProbe()) throw new InvalidOperationException(\"Bluetooth transport connected before caller configuration.\"); ConnectCount++; LastConnectAddress = deviceAddress; return Task.CompletedTask; }")

          # Bluetooth address cache must remain available after the link drops.
          bt_tests = "tests/SolarNet.BluetoothClassic.SmokeTests/Program.cs"
          replace_one(
              bt_tests,
              '''            await BluetoothClassicCarriesAuthoritativeTurns().ConfigureAwait(false);\n            Console.WriteLine("PASS BluetoothClassicCarriesAuthoritativeTurns");\n            return 0;''',
              '''            await BluetoothClassicCarriesAuthoritativeTurns().ConfigureAwait(false);\n            Console.WriteLine("PASS BluetoothClassicCarriesAuthoritativeTurns");\n            await LastKnownDeviceAddressSurvivesDisconnect().ConfigureAwait(false);\n            Console.WriteLine("PASS LastKnownDeviceAddressSurvivesDisconnect");\n            return 0;''')
          address_test = r'''
    private static async Task LastKnownDeviceAddressSurvivesDisconnect()
    {
        var hub = new FakeBluetoothHub();
        var hostAdapter = hub.Create("AA:00:00:00:00:11", "Host Phone");
        var clientAdapter = hub.Create("AA:00:00:00:00:22", "Client Phone");
        var hostTransport = new BluetoothClassicTransport("host", hostAdapter, new BluetoothClassicTransportOptions(BluetoothClassicRole.Server));
        var clientTransport = new BluetoothClassicTransport("client", clientAdapter, new BluetoothClassicTransportOptions(BluetoothClassicRole.Client));
        var hostPeer = Signal<string>();
        var clientPeer = Signal<string>();
        hostTransport.PeerConnected += peer => hostPeer.TrySetResult(peer);
        clientTransport.PeerConnected += peer => clientPeer.TrySetResult(peer);
        await hostTransport.StartAsync().ConfigureAwait(false);
        await clientTransport.StartAsync().ConfigureAwait(false);
        try
        {
            await clientTransport.ConnectAsync(hostAdapter.Address).ConfigureAwait(false);
            await WaitAsync(hostPeer.Task, "host address-cache handshake").ConfigureAwait(false);
            await WaitAsync(clientPeer.Task, "client address-cache handshake").ConfigureAwait(false);
            await clientTransport.DisconnectPeerAsync("host").ConfigureAwait(false);

            string address;
            True(clientTransport.TryGetLastKnownDeviceAddress("host", out address), "client retains former host Bluetooth address after disconnect");
            Equal(hostAdapter.Address, address, "client cached host Bluetooth address");
            True(hostTransport.TryGetLastKnownDeviceAddress("client", out address), "host retains former client Bluetooth address after disconnect");
            Equal(clientAdapter.Address, address, "host cached client Bluetooth address");
        }
        finally
        {
            await clientTransport.StopAsync().ConfigureAwait(false);
            await hostTransport.StopAsync().ConfigureAwait(false);
        }
    }
'''
          replace_one(
              bt_tests,
              "    private static TaskCompletionSource<T> Signal<T>()",
              address_test + "\n    private static TaskCompletionSource<T> Signal<T>()")
          replace_one(
              bt_tests,
              "    private static void Equal<T>(T expected, T actual, string label)\n    {",
              "    private static void True(bool value, string label)\n    {\n        if (!value) throw new Exception(\"Expected true: \" + label);\n    }\n\n    private static void Equal<T>(T expected, T actual, string label)\n    {")

          # Package/docs advance only with the implementation in the same bounded commit.
          package = "Packages/com.hoonex.solarnet/package.json"
          replace_one(package, '  "version": "0.13.0",', '  "version": "0.14.0",')
          replace_one(
              package,
              '  "description": "Local-first turn-based multiplayer engine with deterministic recovery, process resume, authority checkpoints, host-migration planning, migrated-room bootstrap, and Nearby/Bluetooth transport role switching.",',
              '  "description": "Local-first turn-based multiplayer engine with deterministic recovery, process resume, authority checkpoints, migrated-room topology rebuilding, and Grid Duel automatic authority rotation.",')
          replace_one(
              package,
              '      "description": "Playable 5x5 two-player game with local loopback and two-phone Nearby/Bluetooth Classic modes, active-match reconnect, and client process-resume recovery.",',
              '      "description": "Playable 5x5 two-player game with Nearby/Bluetooth modes, active-match reconnect, process resume, and synchronized link-loss authority migration.",')

          readme = "README.md"
          replace_one(readme, "## Current milestone — 0.13", "## Current milestone — 0.14")
          replace_one(
              readme,
              "- Bluetooth Classic client/server role rebuilding with explicit successor-device-address handling;\n- Unity Diagnostics and playable Grid Duel samples;",
              "- Bluetooth Classic client/server role rebuilding with authenticated last-link device-address recovery;\n- Grid Duel automatic synchronized link-loss migration: checkpoint safety gate, authority epoch rotation, topology rebuild, room rejoin, and state resync;\n- Unity Diagnostics and playable Grid Duel samples;")
          replace_one(
