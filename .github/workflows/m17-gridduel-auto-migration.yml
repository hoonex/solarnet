name: M17 Grid Duel Auto Migration Patch

on:
  push:
    branches:
      - feat/gridduel-auto-host-migration
    paths:
      - .github/workflows/m17-gridduel-auto-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify bounded mission input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dc2ecf1514376dd3a74fbaa165f576542e32dc45"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m17-gridduel-auto-migration.yml"
          test -f .github/m17_patch.py

      - name: Apply M17 structural patches
        run: python .github/m17_patch.py

      - name: Run bounded M17 verification
        run: |
          set -euo pipefail
          dotnet build src/SolarNet.Core/SolarNet.Core.csproj --configuration Release --nologo
          dotnet build tests/SolarNet.GridDuel.UnityCompile/SolarNet.GridDuel.UnityCompile.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuelMigration.SmokeTests/SolarNet.GridDuelMigration.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.GridDuel.SmokeTests/SolarNet.GridDuel.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.MigrationOrchestration.SmokeTests/SolarNet.MigrationOrchestration.SmokeTests.csproj --configuration Release --nologo
          dotnet run --project tests/SolarNet.BluetoothClassic.SmokeTests/SolarNet.BluetoothClassic.SmokeTests.csproj --configuration Release --nologo

      - name: Remove mission files and publish bounded patch
        run: |
          set -euo pipefail
          rm .github/workflows/m17-gridduel-auto-migration.yml .github/m17_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          expected=$(cat <<'EOF'
          .github/m17_patch.py
          .github/workflows/m17-gridduel-auto-migration.yml
          Packages/com.hoonex.solarnet/Runtime/BluetoothClassic/BluetoothClassicMigrationTransportSwitch.cs
          Packages/com.hoonex.solarnet/Runtime/BluetoothClassic/BluetoothClassicTransport.cs
          Packages/com.hoonex.solarnet/Runtime/Nearby/NearbyMigrationTransportSwitch.cs
          Packages/com.hoonex.solarnet/Samples~/GridDuel/GridDuelNetworkedDemo.cs
          EOF
          )
          test "$(git diff --cached --name-only)" = "$expected"
          git commit -m "Wire Grid Duel automatic host migration"
          git push origin HEAD:feat/gridduel-auto-host-migration
