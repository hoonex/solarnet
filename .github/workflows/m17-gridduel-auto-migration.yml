              "Read `docs/chaos-soak.md`, `docs/process-resume.md`, `docs/authority-checkpoint.md`, `docs/host-migration-planner.md`, `docs/migrated-room-transport-switch.md`, and `docs/gridduel-host-migration.md` for recovery contracts and limits.")

          Path("docs/gridduel-host-migration.md").write_text(r'''# Grid Duel automatic host migration

SolarNet 0.14 wires the deterministic migration primitives into the `GridDuelNetworkedDemo` Unity sample.

## Trigger and safety gate

Grid Duel is a two-player sample. During a `Playing` room, loss of the authenticated peer link causes each still-running synchronized process to attempt the same deterministic authority rotation. Before any topology change, `GridDuelMigrationWorkflow.Prepare(...)` captures a `SolarAuthorityCheckpoint`. Capture fails when the local canonical state bytes do not match the current session's last authoritative digest; in that case the sample does **not** promote local state and falls back to the ordinary reconnecting path.

The planner still elects by stable room slot order, not by transient connectivity observations. For Grid Duel this means slot 1 is the deterministic successor to the original slot-0 host. This can sacrifice liveness when slot 1 is actually the process that died, but it avoids peers independently choosing different authorities from conflicting link observations.

## Topology rotation

Once the safety gate passes:

1. the old room is notified of the link loss and detached;
2. the old game session is stopped, fencing the previous authority epoch;
3. Nearby or Bluetooth Classic stops its old physical topology;
4. the elected successor becomes Nearby advertiser / RFCOMM server;
5. the former host becomes Nearby discoverer / RFCOMM client;
6. `SolarRoomMigration.CreateSession(...)` preserves the original player slots while moving room authority to the successor;
7. the successor creates a promoted `SolarTurnSession` from the checkpoint;
8. the former host rejoins as a client and requests authoritative resync before play continues.

Transport switch APIs accept a pre-start configure callback so Unity can subscribe to discovery, verification, connection, and fault events before `StartAsync` or an immediate Bluetooth `ConnectAsync` can emit them.

## Nearby

The former host scans for the migrated room advertisement and automatically requests the matching endpoint. SolarNet still requires the user to compare and accept the Nearby authentication digits on both phones. After the SolarNet peer handshake, the sample additionally checks that the logical peer ID is the elected successor before accepting migrated authority.

## Bluetooth Classic

`BluetoothClassicTransport` records the Android device address associated with an authenticated SolarNet peer handshake and retains that mapping across a link disconnect. Grid Duel resolves the elected successor's last authenticated address before stopping the old transport, then passes it to the migration switch for immediate RFCOMM reconnect. If no authenticated address exists, the UI falls back to paired-device selection. A connected device whose SolarNet peer ID is not the elected successor is disconnected.

## Evidence boundary

CI proves:

- the shared Grid Duel migration helper refuses diverged local state;
- both synchronized peers derive the same successor and epoch;
- slot-1 authority can restore the former host via snapshot and continue canonical turns;
- transport configure callbacks run before new start/connect boundaries;
- Bluetooth peer/device identity remains available after disconnect;
- the Unity sample compiles with the migration wiring;
- existing recovery, room, Grid Duel, Nearby/Bluetooth Android library, and Probe APK gates remain in the normal CI workflow.

CI does **not** prove physical multi-phone radio timing, OEM Bluetooth behavior, Android background/process-death behavior, thermal characteristics, or power consumption. Those remain device-runtime work. Migration state is not yet persisted across a process death that occurs during/after authority rotation; that is the next recovery milestone.
''', encoding="utf-8")

